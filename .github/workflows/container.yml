name: Publish container image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ghcr-publish

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: write
    env:
      OC_MCP_IMAGE: oc-mcp:ci
      OC_MCP_DOMAIN: localhost
      TRAEFIK_NETWORK: oc-mcp-ci-proxy
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build image
        run: |
          docker build --pull --tag oc-mcp:ci \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .

      - name: Start test Traefik
        run: |
          docker network create "$TRAEFIK_NETWORK"
          docker run -d --name oc-mcp-ci-traefik --network "$TRAEFIK_NETWORK" \
            --publish 127.0.0.1:443:443 --volume /var/run/docker.sock:/var/run/docker.sock:ro \
            traefik:v3 --providers.docker --providers.docker.exposedbydefault=false \
            --entrypoints.websecure.address=:443

      - name: Check bridge, relay and HTTPS
        run: |
          docker compose --profile https up --detach --wait --wait-timeout 60
          curl --fail --silent --show-error --retry 5 --retry-all-errors --insecure https://localhost/ >/dev/null
          mcp_url=$(docker compose exec -T bridge python bridge.py mcp-url)
          curl --fail --silent --show-error "$mcp_url" \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"container-check","version":"1"}}}' \
            | jq -e '.result.serverInfo.name == "OpenComputers"'
          installer=$(docker compose exec -T relay python relay.py install container-check)
          read -r _ _ installer_url _ <<< "$installer"
          agent_url=$(curl --fail --silent --show-error --insecure "$installer_url" | sed -n '1s/^local endpoint, computerName, idleDelay = "\([^"]*\)".*/\1/p')
          test "$(curl --fail --silent --show-error --insecure "$agent_url" --data '00000000-0000-0000-0000-000000000001')" = idle
          test "$(curl --silent --show-error --insecure -o /dev/null -w '%{http_code}' "https://localhost/mcp/${mcp_url##*/}")" = 404
          docker compose --profile https up --detach --wait --wait-timeout 60 --force-recreate
          test "$(docker compose exec -T bridge python bridge.py mcp-url)" = "$mcp_url"

      - name: Stop smoke test containers
        if: always()
        run: |
          docker compose --profile https down --volumes
          docker rm -f oc-mcp-ci-traefik || true
          docker network rm "$TRAEFIK_NETWORK" || true

      - name: Publish to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag oc-mcp:ci "$image:sha-$GITHUB_SHA"
          docker tag oc-mcp:ci "$image:latest"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:latest"
          docker buildx imagetools inspect "$image:latest"
